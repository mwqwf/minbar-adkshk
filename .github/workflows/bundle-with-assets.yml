# 🎁 بناء حزمة المتجر مع حزمتي الأصول (المكتبة كاملة دون إنترنت) — على شبكة GitHub لا شبكة المالك.
# التوقيع: إن وُجد السرّان UPLOAD_KEYSTORE_B64 وUPLOAD_KEYSTORE_PROPS (قرار المالك وحده) تُوقَّع الحزمة،
# وإلا تُرفع غير موقّعة ويوقّعها المالك محلياً بـjarsigner (بلا تنزيل الأصول).
name: bundle-with-assets
on:
  workflow_dispatch:
    inputs:
      core_cap_mb:
        description: "سقف حزمة core بالميغابايت (≤ 500)"
        default: "480"
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_KS: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      CORE_CAP_MB: ${{ inputs.core_cap_mb || '480' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: خطّة الحزمتين من الكتالوج
        run: python3 tools/assetpack/plan.py
      - name: تنزيل الصوت من R2 (خروج مجاني)
        run: python3 tools/assetpack/fetch.py
      - name: مفتاح التوقيع (إن وُجد)
        if: env.HAS_KS == 'true'
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          PROPS: ${{ secrets.UPLOAD_KEYSTORE_PROPS }}
        run: |
          echo "$KS" | base64 -d > upload.jks
          printf '%s\n' "$PROPS" > signing.properties
      - name: بناء الحزمة
        run: chmod +x gradlew && ./gradlew :app:bundleRelease --no-daemon $([ "$HAS_KS" = "true" ] || echo -PallowUnsigned=true)
      - name: تحقّق
        run: |
          ls -la app/build/outputs/bundle/release/
          unzip -l app/build/outputs/bundle/release/*.aab | grep -c "serving/" || true
      - uses: actions/upload-artifact@v4
        with:
          name: minbar-aab-with-assets
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
      # 🚀 الرفع إلى Play من هنا مباشرةً — فلا تعبر الـ٦١٠ م.ب شبكةَ المالك مرّتين
      # (تنزيلاً من Actions ورفعاً إلى المتجر). يعمل فقط متى وُجد سرُّ حساب الخدمة
      # PLAY_SERVICE_ACCOUNT_JSON وكان مأذوناً في Play Console بـ«الإصدار في مسارات
      # الاختبار». وبدونه تبقى الحزمة أثراً (artifact) يُنزَّل يدوياً.
      - name: النشر إلى Play (مسار الاختبار الداخلي)
        if: env.HAS_PLAY == 'true' && env.HAS_KS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ali.menbaradkshk
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
