# 🎁 بناء حزمة المتجر مع حزمتي الأصول (المكتبة كاملة دون إنترنت) — على شبكة GitHub لا شبكة المالك.
#
# 🔐 **الشيفرة عامّة والأسرار خاصّة** — وهذا مضمون بأربعة حواجز:
#   ١) المحفّز `workflow_dispatch` وحدَه: لا يشغّله إلا من له صلاحية الكتابة.
#      ⛔ ولا يُضاف هنا `pull_request_target` ولا `issue_comment` أبداً — هما البابان
#         اللذان يسرّبان أسرار المستودعات العامّة (يشغّلان شيفرة الغريب بأسرارنا).
#   ٢) طلبات الدمج من النسخ الخارجية (forks) **لا تُمنح الأسرار** أصلاً في GitHub.
#   ٣) الإجراءات الخارجية مثبَّتة ببصمة الإيداع (SHA) لا بوسمٍ متحرّك، فلا يُبدَّل
#      محتواها من تحتنا.
#   ٤) صلاحية الرمز المدمج `contents: read` فقط، والمفتاح يُكتب في مجلّد مؤقّت
#      خارج مساحة العمل (فلا يدخل أيّ حزمة) ويُمحى في كل الأحوال بعد البناء،
#      ويُمرَّر بمتغيّرات بيئة لا بملفّ إعدادات.
name: bundle-with-assets
on:
  workflow_dispatch:
    inputs:
      core_cap_mb:
        description: "سقف حزمة core بالميغابايت (≤ 500)"
        default: "480"
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_KS: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      CORE_CAP_MB: ${{ inputs.core_cap_mb || '480' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: خطّة الحزمتين من الكتالوج
        run: python3 tools/assetpack/plan.py
      - name: تنزيل الصوت من R2 (خروج مجاني)
        run: python3 tools/assetpack/fetch.py
      - name: مفتاح التوقيع (إن وُجد)
        if: env.HAS_KS == 'true'
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"
      - name: بناء الحزمة
        env:
          MINBAR_SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          MINBAR_SIGNING_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          MINBAR_SIGNING_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          MINBAR_SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :app:bundleRelease --no-daemon
      - name: تحقّق
        run: |
          set +e
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          ls -la "$AAB"
          echo "::group::جرد الحزمة"
          unzip -l "$AAB" > /tmp/list.txt
          echo "ملفّات الصوت: $(grep -c 'serving/.*\.ogg' /tmp/list.txt)"
          echo "حزم الأصول: $(grep -oE '^\s+[0-9]+\s+[0-9-]+\s+[0-9:]+\s+(core|rest)/' /tmp/list.txt | grep -oE '(core|rest)/' | sort -u | tr '
' ' ')"
          echo "المعالجات: $(grep -oE 'lib/[a-z0-9_-]+/' /tmp/list.txt | sort -u | tr '
' ' ')"
          echo "::endgroup::"
          echo "== التوقيع =="
          jarsigner -verify "$AAB" > /tmp/js.txt 2>&1
          grep -m1 -E 'jar verified|jar is unsigned|no manifest' /tmp/js.txt || tail -3 /tmp/js.txt
          keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -m1 'SHA1:'
          grep -qm1 'jar verified' /tmp/js.txt || { echo '⛔ الحزمة غير موقّعة — أوقف'; exit 1; }
      - name: محو المفتاح من العدّاء
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      # 🚀 النشر إلى Play من هنا مباشرةً — فلا تعبر الـ٦١٠ م.ب شبكةَ المالك مرّتين
      # (تنزيلاً من Actions ورفعاً إلى المتجر). يعمل فقط متى وُجد سرُّ حساب الخدمة
      # وكان مأذوناً في Play Console بـ«الإصدار في مسارات الاختبار».
      - name: النشر إلى Play (المسار الداخلي)
        if: env.HAS_PLAY == 'true' && env.HAS_KS == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ali.menbaradkshk
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
      # الأثر يبقى احتياطاً (٧ أيام) لمن أراد الرفع يدوياً — ٦١٠ م.ب على شبكة ضعيفة.
      - uses: actions/upload-artifact@v4
        with:
          name: minbar-aab-with-assets
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
