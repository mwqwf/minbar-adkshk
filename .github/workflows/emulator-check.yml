# 📱 برهانُ المحاكي في السحابة — «الإعلان ≠ الأثر» بلا حاسوب المالك.
#
# قاعدة المالك: لا يُعلن إنجازٌ في منبر إلا بتشغيلٍ فعليّ على محاكٍ. وكان المحاكي
# على جهازه وحده، فصار هنا: يُبنى APK، ويُقلَع محاكٍ، ويُثبَّت، ويُشغَّل، ويُقرأ
# السجلّ — فإن ظهر انهيارٌ أو تجمّدٌ سقطت التشغيلة، وإلا خرجت لقطةُ شاشةٍ أثراً.
# ⛔ والهاتف ممنوع بأمر المالك: المحاكي وحده هنا وهناك.
name: emulator-check
on:
  workflow_dispatch:
    inputs:
      api:
        description: "مستوى أندرويد للمحاكي"
        default: "34"
permissions:
  contents: read
jobs:
  smoke:
    # المحاكي يحتاج تسريعَ العتاد، وهو متاحٌ في عدّاءات لينكس العامّة.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: بناء نسخة التصحيح
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: تمكين تسريع KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: إقلاع المحاكي وتشغيل التطبيق
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ inputs.api || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # ⛔ سطرٌ واحد عمداً: العدّاء ينفّذ كلّ سطرٍ في صدفةٍ مستقلّة
          #    فتضيع المتغيّرات بين الأسطر — والمنطق كلّه في السكربت.
          script: bash .github/scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: emulator-proof
          path: |
            screen.png
            logcat.txt
          retention-days: 7
