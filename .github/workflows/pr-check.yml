# ✅ بوّابة طلبات السحب: ترجمةٌ واختباراتٌ وفحصٌ قبل الدمج.
#
# **لماذا وُجد؟** كان المستودع بلا فحصٍ على طلبات السحب البتّة: لا يُترجَم شيء
# ولا يُختبَر إلا حين يُنشر إلى الإنتاج. فكان أوّل من يكتشف خطأ ترجمةٍ هو
# سيرُ النشر نفسه — بعد أن صار الدمج ينشر. فحصٌ يأتي بعد النشر ليس فحصاً.
#
# 🔐 **بلا أسرار قطّ**: هذا السير لا يمسّ مفتاح التوقيع ولا حساب خدمة Play،
#    ولا يبني حزمة متجر ولا يرفع شيئاً. فمحفّز `pull_request` هنا آمن —
#    وهو **ليس** `pull_request_target` المحرّم (ذاك يشغّل شيفرة الغريب
#    بأسرارنا؛ وهذا يشغّل شيفرة الطلب بلا سرٍّ واحد).
name: pr-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # دفعةٌ جديدة تُلغي فحص السابقة — لا طابور بلا فائدة
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: حارس التوثيق (README يطابق مصدر الحقيقة)
        run: python3 tools/sync_readme_version.py --check
      # ⛔ خطوةٌ لكل فحص لا خطوةٌ للثلاثة: حين تفشل واحدة يقول اسمُ الخطوة أيُّها
      #    فشل، بلا تنقيبٍ في سجلٍّ طويل.
      - name: الاختبارات
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --no-daemon
      # ⚠️ **تقريرٌ لا بوّابة — مؤقّتاً، وبإعلانٍ لا بصمت.**
      # أوّل تشغيلةٍ لـlint (ولم يكن يعمل في أيّ سير عملٍ قطّ) أخرجت ستّة أخطاء
      # **سابقةٍ لهذا الطلب** في ملفّات لا يمسّها، أخطرُها اثنان على أندرويد ٦
      # (minSdk 23) — وهي في نسخة الإنتاج الحالية أصلاً:
      #   · QuranDownloadWorker.kt:132,141  MissingPermission
      #   · BackgroundWorkers.kt:156        NewApi (restrictBackgroundStatus، API 24)
      #   · OfflineOnly.kt:90               NewApi (registerDefaultNetworkCallback، API 24)
      #   · PlaybackController.kt:588       UnsafeOptInUsageError
      #   · widget_now_playing.xml:58       UseAppTint
      # فجعلُها بوّابةً اليوم يوقف كلّ عمل على دَينٍ قديم ليس من صنع هذا الطلب.
      # وتُعالَج في طلب سحبٍ مخصَّص، ثمّ **يعود هذا السطر بوّابةً** بحذف
      # `continue-on-error`. ⛔ ولا يُترك هكذا: دَينٌ مؤجَّل لا دَينٌ ملغى.
      - name: الفحص (lint) — تقريرٌ لا بوّابة حتى يُصفّى الدَّين
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon
      - name: بناء نسخة التصحيح
        run: ./gradlew :app:assembleDebug --no-daemon
      # 📄 وتقريرٌ **مقتضب** عند الفشل: أسطر الخطأ وحدها. وسكبُ التقرير كاملاً
      #    كان يدفن الخطأ تحت آلاف أسطر HTML — فلا يُقرأ.
      - name: أسطر الخطأ عند الفشل
        if: failure()
        run: |
          lint=app/build/reports/lint-results-debug.txt
          if [ -f "$lint" ]; then
            echo "::group::أخطاء lint"
            grep -nE "^[^ ].*: (Error|Warning):" "$lint" | head -40 || echo "لا سطرَ مطابق"
            echo "::endgroup::"
          fi
          for x in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$x" ] || continue
            grep -l "<failure" "$x" >/dev/null 2>&1 && {
              echo "::group::اختبارٌ فاشل: $x"; head -c 4000 "$x"; echo; echo "::endgroup::"
            }
          done
          exit 1
