<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>استمع — منبر ادكصهك</title>
<meta name="description" content="استمع إلى دروس منبر ادكصهك مباشرة من المتصفّح — أرشيف صوتي للدروس العلمية، بلا حساب وبلا إعلانات."/>
<link rel="canonical" href="https://minbar-adkassahk.vercel.app/listen"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root{--teal:#247172;--teal-dark:#184b4b;--navy:#020e1d;--bg:#f8fcfc;--gold:#d4af37;--ink:#12242e;--muted:#5b7480}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.9;
       /* مساحةٌ أسفل الصفحة بقدر شريط المشغّل الثابت، فلا يحجب آخر درس. */
       padding-bottom:132px}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:50;background:rgba(248,252,252,.94);backdrop-filter:blur(8px);border-bottom:1px solid #e2efef}
  .nav{display:flex;align-items:center;gap:18px;padding:12px 0}
  .brand{font-family:Amiri,serif;font-weight:700;font-size:21px;color:var(--teal-dark);text-decoration:none}
  .nav .cta{margin-inline-start:auto;background:var(--teal);color:#fff;padding:8px 16px;border-radius:12px;
            text-decoration:none;font-weight:700;font-size:14px}
  h1{font-family:Amiri,serif;font-size:clamp(20px,4vw,27px);color:var(--teal-dark);margin:22px 0 4px}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:16px}
  .search{width:100%;padding:13px 16px;border:1px solid #d7e7e7;border-radius:14px;font-family:inherit;
          font-size:15px;background:#fff;color:var(--ink)}
  .search:focus{outline:2px solid var(--teal);outline-offset:1px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
  .chip{border:1px solid #d7e7e7;background:#fff;color:var(--muted);border-radius:999px;padding:7px 15px;
        font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
  .note{background:#fff;border:1px solid #e2efef;border-radius:16px;padding:18px 20px;margin:18px 0;font-size:14.5px;color:var(--muted)}
  .note b{color:var(--teal-dark)}
  .group{margin-top:22px}
  .group h2{font-size:16px;color:var(--teal-dark);margin-bottom:8px;border-inline-start:4px solid var(--gold);padding-inline-start:10px}
  ul{list-style:none}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e6f1f1;border-radius:14px;
        padding:11px 14px;margin-bottom:8px;width:100%;text-align:start;font-family:inherit;cursor:pointer}
  .item:hover{border-color:var(--teal)}
  .item[aria-current="true"]{border-color:var(--gold);background:#fffdf5}
  .play{width:38px;height:38px;flex:none;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center}
  .play svg{width:17px;height:17px;fill:#fff}
  .meta{min-width:0}
  .meta b{display:block;font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta small{color:var(--muted);font-size:12.5px}
  .bar{position:fixed;inset-inline:0;bottom:0;z-index:60;background:var(--navy);color:#fff;padding:10px 0 14px;
       box-shadow:0 -6px 24px rgba(2,14,29,.22)}
  .bar .wrap{display:flex;flex-direction:column;gap:8px}
  .bar .now{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .now small{display:block;font-weight:400;color:#9db8bd;font-size:12px}
  audio{width:100%;height:38px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:26px 0}
  footer a{color:var(--teal)}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="/">منبر ادكصهك</a>
    <a class="cta" href="https://play.google.com/store/apps/details?id=com.ali.menbaradkshk" rel="noopener">حمّل التطبيق</a>
  </div>
</header>

<main class="wrap">
  <h1>استمع مباشرةً من المتصفّح</h1>
  <p class="sub">بلا حساب وبلا إعلانات. وللاستماع دون إنترنت ولتنزيل الدروس، التطبيق أوسع.</p>

  <input id="q" class="search" type="search" placeholder="ابحث عن درس أو شيخ أو قسم…" aria-label="بحث"/>
  <div id="chips" class="chips"></div>

  <div id="state" class="note">…جارٍ إحضار المكتبة</div>
  <div id="list"></div>
</main>

<div id="bar" class="bar hidden">
  <div class="wrap">
    <div class="now" id="now"></div>
    <audio id="audio" controls preload="none"></audio>
  </div>
</div>

<footer>© 2026 منبر ادكصهك · <a href="/privacy">سياسة الخصوصية</a> · <a href="/">الرئيسية</a></footer>

<script>
(function () {
  "use strict";
  // 🎧 مشغّل الويب. الكتالوج يُطلب من **أصلنا نفسه** عبر `/api/catalog` الذي
  // يُمرّره Vercel إلى الخادم — فلا يحتاج المتصفّح ترويسة CORS من الخادم ولا
  // نضطرّ لتغييره. والصوت يُشغَّل من رابطه مباشرةً: وسمُ <audio> لا يخضع
  // لـCORS ما لم نضع crossorigin، فلا نضعها.
  var el = function (id) { return document.getElementById(id); };
  var stateEl = el("state"), listEl = el("list"), chipsEl = el("chips"),
      qEl = el("q"), barEl = el("bar"), audioEl = el("audio"), nowEl = el("now");

  var lessons = [], subs = {}, cats = {}, catOrder = [], activeCat = "", current = -1, queue = [];

  function txt(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }

  function durationLabel(ms) {
    var s = Math.round((ms || 0) / 1000);
    if (!s) return "";
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    if (h) return h + " س " + m + " د";
    return m ? m + " دقيقة" : "أقل من دقيقة";
  }

  function lessonAudio(l) { return txt(l.audioUrl); }

  function normalize(raw) {
    // الحقول كما يقرؤها التطبيق حرفياً، بمرادفاتها القديمة.
    return {
      id: txt(raw.id),
      title: txt(raw.title) || txt(raw.name) || "درس",
      speaker: txt(raw.speaker || raw.sheikh || raw.reader),
      categoryId: txt(raw.categoryId),
      subcategoryId: txt(raw.subcategoryId || raw.sectionId || raw.subCategoryId),
      audioUrl: txt(raw.audioUrl),
      durationMs: Number(raw.durationMs || raw.duration || 0) ||
                  (Number(raw.durationSeconds || 0) * 1000)
    };
  }

  function render() {
    var term = (qEl.value || "").trim();
    var pool = lessons.filter(function (l) {
      if (activeCat && l.categoryId !== activeCat) return false;
      if (!term) return true;
      var hay = l.title + " " + l.speaker + " " + (subs[l.subcategoryId] || "") + " " + (cats[l.categoryId] || "");
      return hay.indexOf(term) !== -1;
    });
    queue = pool;
    if (!pool.length) {
      listEl.innerHTML = "";
      stateEl.className = "note";
      stateEl.textContent = term ? "لا نتائج لهذا البحث." : "لا دروس في هذا القسم.";
      return;
    }
    stateEl.className = "note hidden";
    // تجميعٌ بالسلسلة (القسم الفرعي) كما في التطبيق.
    var groups = [], index = {};
    pool.forEach(function (l) {
      var key = l.subcategoryId || l.categoryId || "_";
      if (!(key in index)) { index[key] = groups.length; groups.push({ key: key, items: [] }); }
      groups[index[key]].items.push(l);
    });
    var html = groups.map(function (g) {
      var name = subs[g.key] || cats[g.key] || "دروس";
      var items = g.items.map(function (l) {
        var pos = queue.indexOf(l);
        var line = [l.speaker, durationLabel(l.durationMs)].filter(Boolean).join(" · ");
        return '<li><button class="item" data-i="' + pos + '" type="button">' +
          '<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>' +
          '<span class="meta"><b></b><small></small></span></button></li>';
      }).join("");
      return '<section class="group"><h2></h2><ul>' + items + "</ul></section>";
    }).join("");
    listEl.innerHTML = html;
    // النصوص تُكتب بـtextContent لا بالتضمين — فعنوانٌ فيه <> لا يكسر الصفحة.
    var sections = listEl.querySelectorAll("section.group");
    groups.forEach(function (g, gi) {
      sections[gi].querySelector("h2").textContent = subs[g.key] || cats[g.key] || "دروس";
      var buttons = sections[gi].querySelectorAll("button.item");
      g.items.forEach(function (l, li) {
        buttons[li].querySelector("b").textContent = l.title;
        buttons[li].querySelector("small").textContent =
          [l.speaker, durationLabel(l.durationMs)].filter(Boolean).join(" · ");
      });
    });
    markCurrent();
  }

  function markCurrent() {
    var nodes = listEl.querySelectorAll("button.item");
    for (var i = 0; i < nodes.length; i++) {
      var isOn = Number(nodes[i].getAttribute("data-i")) === current;
      if (isOn) { nodes[i].setAttribute("aria-current", "true"); } else { nodes[i].removeAttribute("aria-current"); }
    }
  }

  function play(i) {
    var l = queue[i];
    if (!l || !lessonAudio(l)) return;
    current = i;
    audioEl.src = lessonAudio(l);
    barEl.classList.remove("hidden");
    nowEl.textContent = l.title;
    var small = document.createElement("small");
    small.textContent = [l.speaker, subs[l.subcategoryId] || ""].filter(Boolean).join(" · ");
    nowEl.appendChild(small);
    if (l.id) {
      try { history.replaceState(null, "", "/listen?id=" + encodeURIComponent(l.id)); } catch (e) { /* لا شيء */ }
    }
    audioEl.play().catch(function () { /* المتصفّح يمنع التشغيل التلقائي أحياناً — الأزرار ظاهرة. */ });
    markCurrent();
  }

  listEl.addEventListener("click", function (ev) {
    var btn = ev.target.closest ? ev.target.closest("button.item") : null;
    if (btn) play(Number(btn.getAttribute("data-i")));
  });

  // 🔚 السلسلة تكمل درساً بعد درس، كما في التطبيق.
  audioEl.addEventListener("ended", function () {
    if (current >= 0 && current + 1 < queue.length) play(current + 1);
  });

  var timer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(render, 160);
  });

  function buildChips() {
    var all = document.createElement("button");
    all.className = "chip"; all.type = "button"; all.textContent = "كل الأقسام";
    all.setAttribute("aria-pressed", "true");
    chipsEl.appendChild(all);
    var buttons = [all];
    catOrder.forEach(function (id) {
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = cats[id];
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { activeCat = id; press(b); render(); });
      chipsEl.appendChild(b); buttons.push(b);
    });
    all.addEventListener("click", function () { activeCat = ""; press(all); render(); });
    function press(on) {
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b === on)); });
    }
  }

  function fail(message) {
    stateEl.className = "note";
    stateEl.innerHTML = "";
    var b = document.createElement("b");
    b.textContent = "تعذّر إحضار المكتبة. ";
    stateEl.appendChild(b);
    stateEl.appendChild(document.createTextNode(message + " ويمكنك الاستماع كاملاً في التطبيق."));
  }

  fetch("/api/catalog", { headers: { accept: "application/json" } })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      (data.categories || []).forEach(function (c) {
        if (!c || !c.id) return;
        cats[c.id] = txt(c.name) || "قسم";
        catOrder.push(c.id);
      });
      (data.subcategories || []).forEach(function (s) {
        if (s && s.id) subs[s.id] = txt(s.name) || "سلسلة";
      });
      lessons = (data.lessons || []).map(normalize).filter(function (l) { return l.audioUrl; });
      if (!lessons.length) return fail("لا دروس فيها صوتٌ قابل للتشغيل.");
      buildChips();
      render();
      // رابطٌ عميق: /listen?id=… يبدأ من ذلك الدرس.
      var wanted = new URLSearchParams(location.search).get("id");
      if (wanted) {
        for (var i = 0; i < queue.length; i++) {
          if (queue[i].id === wanted) { play(i); break; }
        }
      }
    })
    .catch(function (e) { fail("(" + e.message + ")."); });
})();
</script>
</body>
</html>
